version: '3.8'

services:
  vit-food-guide:
    build: .
    container_name: vit-food-guide-app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - SESSION_SECRET=vit_campus_dining_secret_key_2026
    volumes:
      - ./data:/app/data
